<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xdutk</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</head>
<body>
<div class="notifications" id="notifications"></div>

<div class="loader" id="loader">
    <div class="ispinner" id="loader-spinner">
        <div class="ispinner-blade"></div>
        <div class="ispinner-blade"></div>
        <div class="ispinner-blade"></div>
        <div class="ispinner-blade"></div>
        <div class="ispinner-blade"></div>
        <div class="ispinner-blade"></div>
        <div class="ispinner-blade"></div>
        <div class="ispinner-blade"></div>
    </div>
    <button class="cursor-hint" id="loader-enter" type="button" hidden>enter</button>
</div>

<div class="spotlight-overlay" id="spotlight-overlay" hidden>
    <div class="spotlight" id="spotlight">
        <div class="spotlight-input-wrapper">
            <i class="fas fa-search spotlight-icon"></i>
            <input type="text" class="spotlight-input" placeholder="Search..." id="spotlight-input" autocomplete="off">
            <span class="spotlight-shortcut">esc</span>
        </div>
        <div class="spotlight-results" id="spotlight-results"></div>
    </div>
</div>

<div class="context-menu" id="context-menu" hidden></div>

<button class="keyboard-hint" id="keyboard-hint" type="button">
    <i class="fas fa-search"></i>
    <span>search</span>
    <kbd>Ctrl</kbd><kbd>K</kbd>
</button>
<!-- в•ђв•ђ РљРЈР РЎРћР  в•ђв•ђ -->
    <div id="cursor-dot"></div>
    <div id="cursor-ring"></div>

    <!-- в•ђв•ђ Р’Р†Р”Р•Рћ Р¤РћРќ в•ђв•ђ -->
    <div class="bg-video-wrap">
        <video autoplay muted loop playsinline id="bg-video">
            <source src="coolbg.webm" type="video/webm">
        </video>
        <div class="bg-overlay"></div>
    </div>

    <!-- в•ђв•ђ SMOKE в•ђв•ђ -->
    <div id="smoke-box"></div>

    <!-- в•ђв•ђ GARLAND в•ђв•ђ -->
    <canvas id="garland-canvas"></canvas>

    <!-- в•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђ BIO CARD в•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђ -->
    <div id="bio-card" class="bio-card">
        <div class="title-bar" id="bio-drag">
            <div class="dots">
                <span class="dot dot-red" onclick="closeCard()"></span>
                <span class="dot dot-yellow" onclick="collapseCard()"></span>
                <span class="dot dot-green" id="green-dot" onclick="shootFireworks()"></span>
            </div>
            <span class="bar-title" data-key="barTitle">bio.app</span>
            <div style="width:52px"></div>
        </div>

        <div class="card-body" id="card-body">
            <div class="avatar-wrap" id="avatar-wrap">
                <img src="avatar.png" id="av-normal" class="av shown" draggable="false">
                <img src="angryavatar.jpg" id="av-angry" class="av hidden" draggable="false">
            </div>

            <h1 class="username animated-gradient">xdutk</h1>
            <p class="userbio"><span id="typed-text">I love dogs&lt;3</span><span class="text-cursor" id="text-cursor">|</span></p>

            <div class="links">
                <a href="https://t.me/xdutk" target="_blank" class="btn">
                    <i class="fab fa-telegram-plane"></i>
                    <span data-key="tg">write to me</span>
                </a>
                <button class="btn" onclick="copyCS(this)">
                    <i class="fas fa-crosshairs"></i>
                    <span data-key="cs">CS crosshair</span>
                    <span class="copy-tip">Copied!</span>
                </button>
                <a href="https://drive.google.com/uc?export=download&id=1og3EIBfLlzkgD0lJ263zr8THlrRXuH_3" class="btn">
                    <i class="fas fa-cube"></i>
                    <span data-key="mc">Minecraft pack</span>
                </a>
                <a href="https://steamcommunity.com/profiles/76561199841630286/" target="_blank" class="btn">
                    <i class="fab fa-steam"></i>
                    <span data-key="steam">Steam</span>
                </a>
            </div>
        </div>
    </div>

    <!-- в•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђ РџР›Р•Р•Р  в•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђ -->
    <div id="player" class="player">
        <div class="player-drag" id="player-drag">
            <div class="pl-top">
                <div class="pl-art" id="pl-art"><img src="track-cover.svg" alt="" class="pl-cover"><i class="fas fa-music pl-art-icon"></i></div>
                <div class="pl-info">
                    <div class="pl-track" id="track-name">&#1059;&#1083;&#1080;&#1094;&#1072; &#1057;&#1090;&#1072;&#1083;&#1077;&#1074;&#1072;&#1088;&#1086;&#1074;</div>
                    <div class="pl-artist" id="pl-artist">&#1042;&#1072;&#1083;&#1077;&#1085;&#1090;&#1080;&#1085; &#1057;&#1090;&#1088;&#1099;&#1082;&#1072;&#1083;&#1086;</div>
                </div>
                <button class="pl-pause-btn" onclick="togglePlay()">
                    <i class="fas fa-play" id="play-icon"></i>
                </button>
            </div>

            <div class="pl-progress-row">
                <span class="pl-time" id="cur-t">0:00</span>
                <div class="pl-bar-wrap">
                    <input type="range" id="prog" class="pl-bar" min="0" max="100" value="0">
                </div>
                <span class="pl-time" id="tot-t">0:00</span>
            </div>

            <div class="pl-vol-row">
                <i class="fas fa-volume-down pl-vol-icon"></i>
                <input type="range" id="vol" class="pl-bar pl-vol-bar" min="0" max="1" step="0.01" value="0.5">
                <i class="fas fa-volume-up pl-vol-icon"></i>
            </div>
        </div>
        <audio id="audio" src="music.mp3" loop></audio>
    </div>

<script src="garland.js"></script>
<script src="script.js"></script>
</body>
</html>
